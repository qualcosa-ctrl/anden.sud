<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anden del Sud | Bares, Restaurantes y Boliches de Arias y la Región</title>
  <meta name="description" content="Qué hacer en Arias: monumentos históricos, los mejores restaurantes, bares, clubes y visitas que no puedes perderte. ¡Planea tu visita!">
  <meta name="keywords" content="turismo, Arias, qué visitar, que hacer en, donde comer en, donde dormir en, historia de, guía de viaje">
  <meta property="og:title" content="Qué hacer en Arias Córdoba y la región">
  <meta property="og:description" content="Guía de los mejores sitios de interés, bares, restaurantes, hoteles de Arias, Córdoba.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2340&q=80"> <!-- Placeholder; reemplaza con imagen real -->
  <meta property="og:url" content="https://tudominio.com"> <!-- Reemplaza con URL real -->
  <meta name="google-site-verification" content="bLrA4MIOuV-FWwUl-FqdKXHqOGMxhasDv2FBFh-6Afw" />
  <meta name="geo.region" content="AR" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <!-- Agregada Inter -->

  <style>
    :root {
      --primary: #8d1e1e;
      --secondary: #3a5f2a;
      --accent: #d97706;
      --text: #222;
      --light: #f8f5f0;
      --gray: #555;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif; /* Ahora cargada */
      color: var(--text);
      background: var(--light);
      line-height: 1.7;
    }
    h1, h2, h3 {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      font-weight: 600;
    }

    .header {
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      position: sticky;
      top:0; z-index:100;
      padding: 1.2rem 6%;
    }
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 2.1rem; color: var(--primary); font-weight:700; }
    .main-nav ul { display: flex; gap: 2.2rem; list-style: none; font-weight:500; }
    .main-nav a:hover { color: var(--primary); }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.7)),
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2340&q=80') center/cover;
      color: white;
      padding: 14rem 6% 9rem;
      text-align: center;
    }
    .hero h1 { font-size: 4.2rem; margin-bottom: 1.2rem; text-shadow: 0 4px 14px rgba(0,0,0,0.8); }
    .hero p { font-size: 1.45rem; max-width: 720px; margin: 0 auto 2.5rem; opacity: 0.95; }

    .btn {
      background: var(--accent);
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      font-weight:600;
      transition: all 0.3s;
    }
    .btn:hover { background: #b45309; transform: translateY(-3px); }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 6%; }

    .section-title {
      font-size: 2.6rem;
      margin: 4rem 0 2.2rem;
      color: var(--primary);
      position: relative;
      display: inline-block;
    }
    .section-title:after {
      content: '';
      position: absolute;
      bottom: -10px; left:0;
      width: 100px; height: 5px;
      background: var(--accent);
    }

    .search-section {
      padding: 2rem 6%;
      background: white;
      border-bottom: 1px solid #eee;
    }
    #search-input {
      width: 100%;
      max-width: 700px;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid var(--secondary);
      border-radius: 50px;
      outline: none;
      margin: 0 auto;
      display: block;
    }
    #search-input:focus { border-color: var(--accent); }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: 3rem auto;
      justify-content: center;
      max-width: 1200px;
    }
    .cat-btn {
      background: white;
      border: 2px solid var(--secondary);
      color: var(--secondary);
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 500;
      transition: all 0.25s;
      cursor: pointer;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--secondary);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2.2rem;
      margin-bottom: 5rem;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,0.09);
      transition: all 0.3s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.14);
    }
    .card.hidden { /* Reemplaza selector problemático */
      opacity: 0;
      transform: scale(0.98);
      height: 0;
      margin: 0;
      overflow: hidden;
    }
    .card-img {
      height: 240px;
      background-size: cover;
      background-position: center;
    }
    .card-body { padding: 1.6rem; }
    .card-type {
      color: var(--secondary);
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 0.7rem;
    }
    .card h3 { font-size: 1.45rem; margin-bottom: 0.9rem; }
    .card p { color: var(--gray); font-size: 1rem; }
    .card-location { font-size: 0.9rem; color: #777; margin-top: 1rem; font-style: italic; }

    .card-link {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      text-decoration: none;
      background: transparent;
    }

    .banner-slider {
      max-width: 1200px;
      margin: 0rem auto;
      position: relative;
      overflow: hidden;
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 250px;
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease;
    }
    .slide {
      min-width: 100%;
      height: 100%;
      position: relative;
    }
    .slides img {
      width: 100%; /* Fluido en lugar de fijo */
      height: 250px;
      object-fit: cover;
    }

    .protagonistas-section {
      max-width: 1400px;
      margin: 5rem auto;
      padding: 0 6%;
    }
    .protagonistas-title {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 3rem;
    }
    .protagonista-card {
      position: relative;
      display: flex;
      flex-direction: row;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      margin-bottom: 3rem;
      height: 320px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .protagonista-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    }
    .protagonista-img {
      width: 45%;
      background-size: cover;
      background-position: center;
    }
    .protagonista-content {
      width: 55%;
      padding: 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .protagonista-type {
      color: var(--secondary);
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .protagonista-content h3 {
      font-size: 2.2rem;
      margin-bottom: 1.2rem;
      line-height: 1.2;
    }
    .protagonista-content p {
      font-size: 1.15rem;
      color: var(--gray);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .protagonista-location {
      font-size: 1rem;
      color: var(--accent);
      font-style: italic;
    }
    .protagonista-card .card-link {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .hero { padding: 9rem 6% 6rem; }
      .hero h1 { font-size: 2.8rem; }
      .main-nav ul { gap: 1.4rem; font-size: 0.95rem; flex-wrap: wrap; justify-content: center; }
      .protagonista-card {
        flex-direction: column;
        height: auto;
        min-height: 500px;
      }
      .protagonista-img {
        width: 100%;
        height: 300px;
      }
      .protagonista-content {
        width: 100%;
        padding: 2rem;
      }
      .protagonista-content h3 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
